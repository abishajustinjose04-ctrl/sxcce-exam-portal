
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SXCCE ExamPortal</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/common.js" defer></script>
    <script src="/admin.js" defer></script>
</head>
<body>
<main class="login-card">
    <h1>Admin Dashboard</h1>
    <p id="adminName">Welcome, Admin</p>

    <h2>Create an Exam</h2>
    <form id="examForm">
        <label for="examTitle">Exam Title</label>
        <input id="examTitle" required maxlength="150"
               placeholder="Example: Java Basics Test">

        <label for="examDuration">Duration (minutes)</label>
        <input id="examDuration" type="number" min="1" max="300"
               value="10" required>

        <button type="submit">Create Exam</button>
    </form>

    <p id="examMessage" role="status"></p>

    <hr>
    <h2>Manage Exams</h2>
    <div id="adminExamList">Loading exams...</div>

    <hr>
    <h2>Other Actions</h2>
    <p><a href="/admin-questions.html">Add Questions / Manage Questions</a></p>
    <p><a href="/admin-results.html">View Student Results</a></p>
    <button id="logoutButton" type="button">Logout</button>
</main>
</body>
</html>
