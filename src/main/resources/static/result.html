
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result | SXCCE ExamPortal</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/common.js" defer></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const result = JSON.parse(
                sessionStorage.getItem("lastExamResult") || "null"
            );

            const content = document.getElementById("resultContent");

            if (!result) {
                content.textContent = "No recent result found.";
                return;
            }

            document.getElementById("score").textContent =
                result.score + " / " + result.total;

            document.getElementById("tabSwitches").textContent =
                result.tabSwitches;
        });
    </script>
</head>
<body>
    <main class="login-card">
        <h1>Exam Submitted!</h1>
        <div id="resultContent">
            <p>Your score: <strong id="score"></strong></p>
            <p>Tab-switch events recorded: <strong id="tabSwitches"></strong></p>
        </div>
        <button onclick="window.location.href='/student-dashboard.html'">
            Back to Dashboard
        </button>
        <button onclick="logout()">Logout</button>
    </main>
</body>
</html>
